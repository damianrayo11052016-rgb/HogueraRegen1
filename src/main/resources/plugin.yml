name: HogueraRegen
version: ${project.version}
main: com.example.hogueraregen.HogueraRegen
api-version: '26.3'
description: Las hogueras encendidas regeneran la vida de los jugadores cercanos.
author: Damian
commands:
  hogueraregen:
    description: Recarga la configuración del plugin
    usage: /hogueraregen reload
    permission: hogueraregen.admin
permissions:
  hogueraregen.admin:
    description: Permite recargar el plugin
    default: op
  hogueraregen.use:
    description: Permite recibir la regeneración de las hogueras
    default: true
